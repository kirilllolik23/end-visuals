name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Inspect Forge GUI source
        if: always()
        shell: bash
        run: |
          SOURCE_JAR=".gradle/mavenizer/repo/net/minecraftforge/forge/1.21.4-54.1.22/forge-1.21.4-54.1.22-sources.jar"

          if [ ! -f "$SOURCE_JAR" ]; then
            echo "Forge sources jar not found: $SOURCE_JAR"
            exit 1
          fi

          for file in \
            net/minecraftforge/client/event/RenderGuiEvent.java \
            net/minecraftforge/client/event/AddGuiOverlayLayersEvent.java \
            net/minecraftforge/client/event/RegisterGuiOverlaysEvent.java
          do
            echo ""
            echo "========== $file =========="
            unzip -p "$SOURCE_JAR" "$file" || true
          done

          echo ""
          echo "========== GUI overlay source files =========="
          unzip -Z1 "$SOURCE_JAR" |
            grep -Ei 'net/minecraftforge/client/.*(GuiOverlay|OverlayLayer).*\.java$' || true