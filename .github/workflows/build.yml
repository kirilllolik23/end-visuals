name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Inspect layered HUD API
        if: always()
        shell: bash
        run: |
          SOURCE_JAR=".gradle/mavenizer/repo/net/minecraftforge/forge/1.21.4-54.1.22/forge-1.21.4-54.1.22-sources.jar"

          if [ ! -f "$SOURCE_JAR" ]; then
            echo "Forge sources jar not found: $SOURCE_JAR"
            exit 1
          fi

          echo "========== AddGuiOverlayLayersEvent.java =========="
          unzip -p "$SOURCE_JAR" \
            net/minecraftforge/client/event/AddGuiOverlayLayersEvent.java

          echo ""
          echo "========== ForgeLayeredDraw source =========="

          mapfile -t matches < <(
            unzip -Z1 "$SOURCE_JAR" |
              grep -E '(^|/)ForgeLayeredDraw\.java$' || true
          )

          if [ "${#matches[@]}" -eq 0 ]; then
            echo "ForgeLayeredDraw.java not found in sources jar"
          fi

          for file in "${matches[@]}"; do
            echo ""
            echo "========== $file =========="
            unzip -p "$SOURCE_JAR" "$file"
          done

          echo ""
          echo "========== ExampleMod.java =========="
          cat src/main/java/com/example/examplemod/ExampleMod.java