name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Inspect fire and hit hooks
        if: always()
        shell: bash
        run: |
          SOURCE_JAR=".gradle/mavenizer/repo/net/minecraftforge/forge/1.21.4-54.1.22/forge-1.21.4-54.1.22-sources.jar"

          if [ ! -f "$SOURCE_JAR" ]; then
            echo "Forge sources jar not found: $SOURCE_JAR"
            exit 1
          fi

          for file in \
            net/minecraftforge/client/event/RenderBlockScreenEffectEvent.java \
            net/minecraftforge/event/entity/player/AttackEntityEvent.java
          do
            echo ""
            echo "========== $file =========="
            unzip -p "$SOURCE_JAR" "$file" || true
          done

          echo ""
          echo "========== Compiled fire and attack event classes =========="

          FORGE_JAR=".gradle/mavenizer/repo/net/minecraftforge/forge/1.21.4-54.1.22/forge-1.21.4-54.1.22.jar"

          if [ -f "$FORGE_JAR" ]; then
            unzip -Z1 "$FORGE_JAR" |
              grep -E '(RenderBlockScreenEffectEvent|AttackEntityEvent).*\.class$' || true
          else
            echo "Forge binary jar not found: $FORGE_JAR"
          fi