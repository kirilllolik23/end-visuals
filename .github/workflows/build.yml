name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Find Forge GUI events
        if: always()
        shell: bash
        run: |
          echo "Searching Forge and generated Minecraft jars..."

          find .gradle "$HOME/.gradle/caches" \
            -type f -name '*.jar' -print0 2>/dev/null |
          while IFS= read -r -d '' jar; do
            matches=$(unzip -Z1 "$jar" 2>/dev/null |
              grep -E '^net/minecraftforge/client/event/[^/]*(Gui|Overlay)[^/]*\.(class|java)$' |
              head -100 || true)

            if [ -n "$matches" ]; then
              echo ""
              echo "=== $jar ==="
              echo "$matches"
            fi
          done